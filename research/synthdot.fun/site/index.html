<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYNTH · coins with a face</title>
<meta name="description" content="Launch a coin. Give it a face. Let it post. The launchpad where every coin gets its own character, posting reels to pump it 24/7.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="SYNTH">
<meta property="og:description" content="Launch a coin. Give it a face. Let it post.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -10 130 162'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='90' y2='142' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23E4FF3D'/%3E%3Cstop offset='.55' stop-color='%233DFF7A'/%3E%3Cstop offset='1' stop-color='%2300B88A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M0 54C0 22 20 0 45 0S90 22 90 54L90 82C90 95 84 99 79 93C75 88 72 91 72 99L72 132C72 143 60 143 60 132L60 104C60 99 56 99 54 103C47 110 21 110 11 102C3 96 0 88 0 78Z' fill='url(%23g)'/%3E%3Cellipse cx='34' cy='52' rx='5' ry='7.5'/%3E%3Cellipse cx='56' cy='52' rx='5' ry='7.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--bg1:#07090A;--bg2:#0C0F0E;--bg3:#121614;--line:#1A211D;--line2:#24302A;
  --tx:#F4F7F5;--tx2:#A3ABA7;--tx3:#69716D;
  --g1:#E4FF3D;--g2:#3DFF7A;--g3:#00B88A;--gt:#D7FFE3;
  --grad:linear-gradient(135deg,#E4FF3D 0%,#3DFF7A 55%,#00B88A 100%);
  --gradx:linear-gradient(90deg,#E4FF3D,#3DFF7A);
  --red:#FF5C7A;--r:16px;--r2:22px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --side:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx)}
img{display:block;max-width:100%}
::selection{background:#3DFF7A;color:#000}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
.app{position:relative;z-index:1;display:flex;min-height:100vh}

/* sidebar */
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);border-right:1px solid var(--line);background:rgba(3,4,4,.82);backdrop-filter:blur(14px);display:flex;flex-direction:column;padding:22px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 26px}
.brand svg{width:30px;height:auto;flex:none}
.brand b{font-size:26px;font-weight:900;letter-spacing:-1.2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:12px;color:var(--tx2);font-weight:600;font-size:15px;transition:.15s;position:relative}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{color:var(--tx);background:var(--bg2)}
.nav a.on{color:var(--tx);background:linear-gradient(90deg,rgba(61,255,122,.12),rgba(61,255,122,0) 80%)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gradx)}
.nav a.launch{color:var(--tx)}
.nav a.launch .ico{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;margin-left:-3px;margin-right:-3px}
.nav a.launch .ico svg{width:16px;height:16px;color:#000}
.nav .dot{position:absolute;right:14px;width:7px;height:7px;border-radius:50%;background:var(--g2);box-shadow:0 0 10px var(--g2)}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 18px;border-radius:13px;font-weight:700;font-size:15px;transition:.15s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-pri{background:var(--grad);color:#021006}
.btn-pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-pri:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn-sec{background:var(--bg2);border:1px solid var(--line2);color:var(--tx)}
.btn-sec:hover{border-color:#355042;background:var(--bg3)}
.btn-white{background:#fff;color:#000}
.btn-white:hover{background:#E8FFEF}
.btn-sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn-block{width:100%}

/* topbar */
.main{flex:1;margin-left:var(--side);min-width:0}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;padding:14px 32px;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .mbrand{display:none}
.ca{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg1);font-family:var(--mono);font-size:13px;max-width:100%;min-width:0}
.ca .lbl{color:var(--g2);font-weight:700;letter-spacing:1px}
.ca .val{color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ca .val.muted{color:var(--tx3)}
.ca button{height:30px;padding:0 11px;border-radius:8px;background:var(--bg3);border:1px solid var(--line2);font-family:var(--sans);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;flex:none}
.ca button:hover{border-color:var(--g3)}
.ca button svg{width:14px;height:14px}
.top .sp{flex:1}
.xbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--bg1);display:grid;place-items:center;flex:none}
.xbtn:hover{border-color:#fff}
.xbtn svg{width:17px;height:17px}
.wallet{height:40px;font-size:14px}
.wallet .wdot{width:8px;height:8px;border-radius:50%;background:var(--g2);box-shadow:0 0 8px var(--g2)}
.view{padding:30px 32px 80px;max-width:1440px}

/* common */
.h1{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1.02}
.sub{color:var(--tx2);font-size:16px;line-height:1.55;margin-top:10px;max-width:640px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2.5px;color:var(--tx3);text-transform:uppercase}
.gtext{background:var(--gradx);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{background:rgba(9,12,11,.86);border:1px solid var(--line);border-radius:var(--r2)}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid #1F4D2C;background:#08140C;color:var(--gt);font-size:13px;font-weight:600}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--g2);box-shadow:0 0 8px var(--g2)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;background:var(--bg3);border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--tx2)}
.tag.g{color:#021006;background:var(--gradx);border:0}
.tag.warn{color:#FFE38A;border-color:#4A3F12;background:#151105}
.mono{font-family:var(--mono)}
.muted{color:var(--tx3)}
.row{display:flex;align-items:center;gap:10px}
.empty{padding:56px 24px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r2);background:rgba(7,9,9,.6)}
.empty h3{font-size:20px;font-weight:800;margin-bottom:8px}
.empty p{color:var(--tx2);margin-bottom:20px;font-size:15px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:44px 0 16px}
.sec-title h2{font-size:24px;font-weight:850;letter-spacing:-.8px;display:flex;align-items:center;gap:12px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--g2);letter-spacing:1px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--g2);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(61,255,122,.6)}50%{opacity:.6;box-shadow:0 0 0 6px rgba(61,255,122,0)}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;border:1px solid var(--line);background:radial-gradient(1200px 500px at 80% 30%,rgba(61,255,122,.10),transparent 60%),linear-gradient(180deg,#070A08,#030504);padding:56px 56px 50px;display:grid;grid-template-columns:1.1fr 1fr;gap:30px;min-height:520px}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(61,255,122,.10) 1px,transparent 1px);background-size:24px 24px;mask-image:radial-gradient(600px 400px at 75% 50%,#000,transparent);pointer-events:none}
.hero h1{font-size:76px;font-weight:900;letter-spacing:-4px;line-height:.96;margin:22px 0 22px}
.hero p{color:var(--tx2);font-size:18px;line-height:1.55;max-width:520px}
.hero .cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero .cta .btn{height:54px;padding:0 24px;font-size:16px;border-radius:15px}
.hero .trust{display:flex;gap:22px;margin-top:34px;color:var(--tx3);font-size:13.5px;flex-wrap:wrap}
.hero .trust span{display:flex;align-items:center;gap:7px}
.hero .trust svg{width:15px;height:15px;color:var(--g2)}
.phones{position:relative;z-index:1;min-height:420px}
.phone{position:absolute;width:232px;height:420px;border-radius:34px;background:#050706;border:1px solid #22302A;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden}
.phone.p1{left:6%;top:38px;transform:rotate(-9deg);opacity:.75}
.phone.p2{left:32%;top:0;z-index:3;animation:float 6s ease-in-out infinite}
.phone.p3{left:60%;top:46px;transform:rotate(8deg);opacity:.75}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.float-chip{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:rgba(8,14,10,.92);border:1px solid #1F4D2C;font-size:13px;font-weight:600;color:var(--gt);backdrop-filter:blur(8px)}
.float-chip svg{width:15px;height:15px;color:var(--g2)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stat{padding:20px 22px;display:flex;align-items:center;gap:16px}
.stat .si{width:44px;height:44px;border-radius:12px;background:#0B1A10;border:1px solid #1F4D2C;display:grid;place-items:center;color:var(--g2);flex:none}
.stat .si svg{width:20px;height:20px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-1px}
.stat span{color:var(--tx3);font-size:13px}

/* marquee */
.marq{margin-top:18px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:rgba(7,9,9,.7);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq .tr{display:flex;gap:34px;padding:13px 0;width:max-content;animation:marq 40s linear infinite}
.marq:hover .tr{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.marq .it{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--tx2);white-space:nowrap}
.marq .it img,.marq .it .av{width:24px;height:24px;border-radius:50%}
.marq .it b{color:var(--tx);font-weight:800}

/* stories */
.stories{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;width:78px;cursor:pointer}
.story .ring{width:72px;height:72px;border-radius:50%;padding:3px;background:var(--grad)}
.story .ring.add{background:none;border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--tx2)}
.story .ring.add svg{width:24px;height:24px}
.story .ring img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover}
.story span{font-size:12.5px;color:var(--tx2);max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:var(--bg1);font-weight:600;font-size:14px;color:var(--tx2);display:inline-flex;align-items:center;gap:7px}
.chip svg{width:15px;height:15px}
.chip:hover{color:var(--tx);border-color:#355042}
.chip.on{background:#fff;color:#000;border-color:#fff}
.search{flex:1;min-width:200px;max-width:360px;margin-left:auto;display:flex;align-items:center;gap:9px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg1)}
.search svg{width:16px;height:16px;color:var(--tx3)}
.search input{flex:1;background:none;border:0;outline:0;font-size:14px}
.sel{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg1);font-size:14px;font-weight:600;outline:0}

/* coin grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.coin{overflow:hidden;border-radius:var(--r2);border:1px solid var(--line);background:rgba(8,11,10,.92);transition:.18s;cursor:pointer;display:flex;flex-direction:column}
.coin:hover{border-color:#2B4A36;transform:translateY(-3px)}
.coin .cover{position:relative;height:230px;padding:16px;display:flex;flex-direction:column;overflow:hidden}
.coin .cover .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;filter:blur(2px) saturate(1.1);transform:scale(1.1)}
.coin .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.coin .cover>*{position:relative;z-index:1}
.coin .cover .tp{display:flex;justify-content:space-between;align-items:center}
.coin .tick{height:26px;padding:0 9px;border-radius:8px;background:rgba(0,0,0,.55);font-family:var(--mono);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center}
.coin .age{height:26px;padding:0 8px;border-radius:8px;background:rgba(0,0,0,.55);font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center}
.coin .cap{margin-top:auto;font-size:28px;font-weight:900;letter-spacing:-1.2px;line-height:1.02;text-shadow:0 2px 20px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.coin .star{width:32px;height:32px;border-radius:9px;background:rgba(0,0,0,.55);display:grid;place-items:center}
.coin .star svg{width:16px;height:16px}
.coin .star.on svg{fill:var(--g2);color:var(--g2)}
.coin .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.idrow{display:flex;align-items:center;gap:11px;min-width:0}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg3);border:2px solid #000;box-shadow:0 0 0 2px #22392B}
.idrow .nm{min-width:0}
.idrow .nm b{display:block;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idrow .nm span{display:block;font-size:13px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta div{padding:9px 11px;border-radius:11px;background:var(--bg2);border:1px solid var(--line)}
.meta small{display:block;font-size:11px;color:var(--tx3);margin-bottom:3px}
.meta b{font-family:var(--mono);font-size:13px;font-weight:600}

/* post card (generated) */
.post{position:relative;overflow:hidden;border-radius:14px;aspect-ratio:1;padding:12px;display:flex;flex-direction:column;cursor:pointer}
.post .pt{font-weight:900;letter-spacing:-.6px;line-height:1.05;margin-top:auto;font-size:19px}
.post .ph{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700}
.post .ph img{width:20px;height:20px;border-radius:50%}
.post .ptk{position:absolute;bottom:10px;right:10px;font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.4)}

/* coin page */
.cp{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.cp-head{padding:28px;display:flex;gap:24px;align-items:center}
.cp-head .big{width:120px;height:120px;border-radius:50%;padding:4px;background:var(--grad);flex:none}
.cp-head .big img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #000}
.cp-head h1{font-size:36px;font-weight:900;letter-spacing:-1.5px}
.cp-head .counts{display:flex;gap:26px;margin:12px 0}
.cp-head .counts b{font-family:var(--mono);font-size:18px;display:block}
.cp-head .counts span{color:var(--tx3);font-size:12.5px}
.cp-head p{color:var(--tx2);line-height:1.5;font-size:15px;max-width:620px}
.cp-head .catch{color:var(--g2);font-weight:600;margin-top:6px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 28px 28px}
.side-card{padding:22px}
.side-card h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv span{color:var(--tx3)}
.kv b{font-weight:600;text-align:right;word-break:break-all}
.tabs{display:flex;gap:6px;padding:0 28px 18px}

/* reels */
.reels{display:grid;grid-template-columns:1fr auto 340px 60px;gap:24px;align-items:center;justify-content:center;min-height:calc(100vh - 140px)}
.reel{position:relative;height:min(calc(100vh - 150px),760px);aspect-ratio:9/16;width:auto;max-width:calc(100vw - 32px);border-radius:28px;overflow:hidden;border:1px solid #22302A;margin:0 auto;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.reel .rbg{position:absolute;inset:0}
.reel .rbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;filter:blur(3px);transform:scale(1.15)}
.reel .rbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.75) 100%)}
.reel .prog{position:absolute;top:14px;left:16px;right:16px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);z-index:3;overflow:hidden}
.reel .prog i{display:block;height:100%;width:0;background:#fff}
.reel .rh{position:absolute;top:30px;left:18px;right:18px;z-index:3;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
.reel .rh img{width:34px;height:34px;border-radius:50%;border:2px solid #fff}
.reel .rh small{color:rgba(255,255,255,.7);font-weight:500}
.reel .rc{position:absolute;inset:0;z-index:2;padding:96px 28px 120px;display:flex;flex-direction:column;justify-content:center}
.reel .rc .face{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.9);margin-bottom:22px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.reel .rc h2{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.35);animation:rin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.reel .rc .tk{margin-top:22px;align-self:flex-start;height:40px;padding:0 16px;border-radius:999px;border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;font-weight:900;font-size:18px}
.reel .rf{position:absolute;left:18px;right:18px;bottom:18px;z-index:3}
.reel .rf p{font-size:14px;margin-bottom:6px}
.reel .rf small{font-size:12.5px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px}
.reel .rf small svg{width:13px;height:13px}
.reel .rf .bar{margin-top:12px;height:50px;border-radius:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;font-family:var(--mono);font-weight:700;font-size:14px}
.ractions{display:flex;flex-direction:column;gap:18px;align-self:end;padding-bottom:30px}
.ract{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--tx2)}
.ract .b{width:52px;height:52px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);display:grid;place-items:center;color:var(--tx)}
.ract .b:hover{border-color:var(--g3)}
.ract .b.g{background:var(--grad);border:0;color:#000}
.ract .b svg{width:21px;height:21px}
.ract .b.on svg{fill:var(--g2);color:var(--g2)}
.rnav{display:flex;flex-direction:column;gap:12px}
.rnav button{width:50px;height:50px;border-radius:50%;border:1px solid var(--line2);background:var(--bg1);display:grid;place-items:center}
.rnav button:hover{border-color:var(--g3)}
.rnav svg{width:20px;height:20px}

/* launch */
.steps{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.steps div{padding:16px 20px;font-size:14px;font-weight:600;color:var(--tx3);border-right:1px solid var(--line);display:flex;gap:9px;align-items:center}
.steps div:last-child{border-right:0}
.steps div i{font-style:normal;font-family:var(--mono);font-size:12px;width:26px;height:22px;border-radius:6px;background:var(--bg3);display:grid;place-items:center}
.steps div.ok{color:var(--tx)}
.steps div.ok i{background:var(--gradx);color:#000}
.fsec{padding:28px;border-bottom:1px solid var(--line)}
.fsec:last-child{border-bottom:0}
.fsec h3{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;letter-spacing:-.4px}
.fsec h3 i{font-style:normal;font-family:var(--mono);font-size:12.5px;width:34px;height:26px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--tx2)}
.fsec h3 i.ok{background:var(--gradx);color:#000;border:0}
.fsec>p{color:var(--tx3);font-size:14px;margin:6px 0 20px 46px}
.drop{display:flex;align-items:center;gap:20px;padding:20px;border:1.5px dashed var(--line2);border-radius:18px;cursor:pointer;transition:.15s;background:rgba(7,9,9,.5)}
.drop:hover,.drop.over{border-color:var(--g3);background:rgba(61,255,122,.04)}
.drop .thumb{width:92px;height:92px;border-radius:18px;background:var(--bg3);display:grid;place-items:center;overflow:hidden;flex:none}
.drop .thumb img{width:100%;height:100%;object-fit:cover}
.drop .thumb svg{width:28px;height:28px;color:var(--tx2)}
.drop b{font-size:17px;display:block;margin-bottom:5px}
.drop span{color:var(--tx3);font-size:13.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
.field label{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.field label small{font-weight:500;color:var(--tx3);font-family:var(--mono);font-size:12px}
.field label a{color:var(--g2);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.inp{height:50px;border-radius:13px;border:1px solid var(--line2);background:var(--bg1);padding:0 15px;font-size:15px;outline:0;transition:.15s;width:100%}
.inp:focus{border-color:var(--g3);box-shadow:0 0 0 3px rgba(61,255,122,.1)}
textarea.inp{height:96px;padding:13px 15px;resize:vertical;line-height:1.5}
.inp.mono{font-family:var(--mono)}
.inp-pre{position:relative}
.inp-pre span{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--tx3);font-family:var(--mono)}
.inp-pre .inp{padding-left:34px}
.err{color:var(--red);font-size:12.5px;min-height:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--line2);background:var(--bg1);font-weight:600;font-size:14px;color:var(--tx2);display:inline-flex;align-items:center;gap:8px}
.opt:hover{color:var(--tx);border-color:#355042}
.opt.on{color:var(--tx);border-color:var(--g2);background:rgba(61,255,122,.08)}
.arch{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.arch button{text-align:left;padding:15px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg1);display:flex;gap:13px;align-items:center}
.arch button:hover{border-color:#355042}
.arch button.on{border-color:var(--g2);background:rgba(61,255,122,.07)}
.arch .ai{width:36px;height:36px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;flex:none;color:var(--g2)}
.arch .ai svg{width:18px;height:18px}
.arch b{display:block;font-size:15px}
.arch span{display:block;font-size:12.5px;color:var(--tx3);margin-top:2px}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--bg1);border:1px solid var(--line2);gap:2px;flex-wrap:wrap}
.seg button{height:36px;padding:0 15px;border-radius:9px;font-weight:600;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--bg3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.lp{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
.sticky{position:sticky;top:90px;display:flex;flex-direction:column;gap:16px}
.mphone{width:100%;max-width:330px;margin:0 auto;border-radius:40px;border:1px solid #22302A;background:#050706;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mphone .scr{border-radius:30px;overflow:hidden;background:#000;min-height:560px;position:relative}
.mphone .notch{width:110px;height:26px;border-radius:20px;background:#111;margin:10px auto 6px}
.ig{padding:8px 16px 16px}
.ig .top2{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin-bottom:14px}
.ig .prof{display:flex;align-items:center;gap:18px}
.ig .prof .ring{width:82px;height:82px;border-radius:50%;padding:3px;background:var(--grad);flex:none}
.ig .prof .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #000}
.ig .cnt{display:flex;gap:16px;text-align:center;flex:1;justify-content:space-around}
.ig .cnt b{display:block;font-size:15px}
.ig .cnt span{font-size:11px;color:var(--tx2)}
.ig .bio{margin-top:12px;font-size:13px;line-height:1.4}
.ig .bio b{display:block}
.ig .bio .l{color:#7FB4FF}
.ig .btns{display:flex;gap:6px;margin-top:12px}
.ig .btns span{flex:1;height:32px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;background:#1B1F1D}
.ig .btns span.f{background:var(--grad);color:#000}
.ig .gridp{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:14px -16px -16px}
.ig .gridp .post{border-radius:0;padding:8px}
.ig .gridp .post .pt{font-size:13px}
.ig .gridp .post .ph{font-size:9px}
.ig .gridp .post .ph img{width:14px;height:14px}
.summary{padding:20px}
.summary h3{font-size:15px;font-weight:800;margin-bottom:10px}
.order{margin-top:14px;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--bg1)}
.order .eyebrow{margin-bottom:8px;display:block}
.order div{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:4px 0}
.order div i{font-style:normal;width:22px;height:22px;border-radius:6px;background:var(--bg3);display:grid;place-items:center;font-family:var(--mono);font-size:11.5px}

/* calls */
.calls{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}
.chat{display:flex;flex-direction:column;height:calc(100vh - 240px);min-height:520px}
.msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px}
.msg .mav{width:38px;height:38px;border-radius:50%;flex:none}
.msg .mh{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:5px}
.msg .mh b{font-family:var(--mono)}
.msg .mh .dev{font-size:10.5px;font-weight:800;color:#021006;background:var(--gradx);padding:1px 6px;border-radius:5px}
.msg .mh small{color:var(--tx3)}
.msg .mt{font-size:15px;line-height:1.45;color:var(--tx);word-break:break-word}
.callcard{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;border:1px solid #2B5C38;background:rgba(61,255,122,.05);margin-bottom:8px;max-width:420px;cursor:pointer}
.callcard img{width:34px;height:34px;border-radius:50%}
.callcard b{font-weight:800}
.callcard .called{margin-left:auto;color:var(--g2);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:4px}
.callcard .called svg{width:13px;height:13px}
.composer{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.composer .row2{display:flex;gap:10px}
.composer .inp{height:48px}
.composer small{color:var(--tx3);font-size:12px}
.rules li{list-style:none;padding:9px 0 9px 22px;position:relative;color:var(--tx2);font-size:14px;line-height:1.45;border-bottom:1px solid var(--line)}
.rules li:last-child{border:0}
.rules li::before{content:"";position:absolute;left:4px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--g2)}
.mc{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.mc:last-child{border:0}
.mc img{width:36px;height:36px;border-radius:50%}
.mc .n{color:var(--tx3);font-family:var(--mono);width:16px}

/* docs */
.docs{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.toc{position:sticky;top:90px;display:flex;flex-direction:column;gap:2px}
.toc .eyebrow{margin:16px 12px 8px}
.toc a{padding:8px 12px;border-radius:9px;color:var(--tx2);font-size:14px;font-weight:500}
.toc a:hover{color:var(--tx);background:var(--bg2)}
.dsec{padding:30px 32px;margin-bottom:16px}
.dsec h2{font-size:28px;font-weight:850;letter-spacing:-1px;margin:6px 0 14px}
.dsec p{color:var(--tx2);line-height:1.65;font-size:15.5px;margin-bottom:12px}
.dsec ul{margin:8px 0 8px 2px}
.dsec li{list-style:none;color:var(--tx2);line-height:1.6;padding:6px 0 6px 24px;position:relative;font-size:15px}
.dsec li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:2px;background:var(--gradx)}
.dsec li b{color:var(--tx)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0 6px}
.flow div{padding:16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg1)}
.flow div i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--g2);display:block;margin-bottom:8px}
.flow div b{display:block;font-size:15px;margin-bottom:4px}
.flow div span{font-size:12.5px;color:var(--tx3)}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:18px 4px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;color:var(--g2);font-weight:500;transition:.2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 4px 18px;color:var(--tx2);line-height:1.6;font-size:15px;margin:0}
.callout{display:flex;gap:12px;padding:15px 17px;border-radius:14px;border:1px solid #4A3F12;background:#120F05;color:#FFE38A;font-size:14px;line-height:1.5;margin-top:10px}
.callout svg{width:18px;height:18px;flex:none;margin-top:1px}

/* features */
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.feat{padding:22px}
.feat .fi{width:42px;height:42px;border-radius:12px;background:#0B1A10;border:1px solid #1F4D2C;display:grid;place-items:center;color:var(--g2);margin-bottom:16px}
.feat .fi svg{width:20px;height:20px}
.feat b{display:block;font-size:16.5px;margin-bottom:8px;letter-spacing:-.3px}
.feat p{color:var(--tx2);font-size:14px;line-height:1.55}

/* footer */
.foot{margin-top:70px;padding-top:34px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
.foot .brand{padding:0 0 12px}
.foot p{color:var(--tx3);font-size:13.5px;line-height:1.55;max-width:300px}
.foot h4{font-family:var(--mono);font-size:11.5px;letter-spacing:2px;color:var(--tx3);margin-bottom:14px;font-weight:600}
.foot a{display:block;color:var(--tx2);font-size:14px;padding:5px 0}
.foot a:hover{color:var(--tx)}
.disc{grid-column:1/-1;border-top:1px solid var(--line);padding-top:20px;color:var(--tx3);font-size:12.5px;line-height:1.55}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{width:min(480px,100%);padding:30px;border-radius:26px;border:1px solid var(--line2);background:#070A08;text-align:center;animation:pop .3s cubic-bezier(.2,.9,.3,1.2);max-height:92vh;overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.modal .box h2{font-size:28px;font-weight:900;letter-spacing:-1px;margin:16px 0 8px}
.modal .box p{color:var(--tx2);line-height:1.55;font-size:15px}
.modal .box .bigav{width:110px;height:110px;margin:0 auto;border-radius:50%;padding:4px;background:var(--grad)}
.modal .box .bigav img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #000}
.modal .acts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:120;padding:13px 18px;border-radius:13px;background:#0B140E;border:1px solid #1F4D2C;color:var(--gt);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:9px;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{border-color:#5A2030;background:#160A0D;color:#FFC2CD}


/* intro */
#intro{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer}
#intro.out{animation:introOut .6s cubic-bezier(.7,0,.3,1) forwards}
@keyframes introOut{to{transform:translateY(-100%)}}
#intro .glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(61,255,122,.18),transparent 65%);opacity:0;animation:fadeIn .6s .55s forwards}
#intro svg{width:120px;height:auto;position:relative;animation:drop .75s cubic-bezier(.3,0,.4,1) both}
@keyframes drop{0%{transform:translateY(-70vh) scale(.9,1.1)}60%{transform:translateY(0) scale(1.18,.82)}75%{transform:translateY(-14px) scale(.95,1.05)}88%{transform:translateY(0) scale(1.04,.97)}100%{transform:none}}
#intro .drip{transform-origin:66px 96px;transform:scaleY(0);animation:drip .45s .7s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes drip{to{transform:scaleY(1)}}
#intro .eye{transform-box:fill-box;transform-origin:center;animation:blink .22s 1.25s}
@keyframes blink{50%{transform:scaleY(.1)}}
#intro b{font-size:56px;font-weight:900;letter-spacing:-2.5px;opacity:0;transform:translateY(14px);animation:wm .45s 1s cubic-bezier(.2,.8,.2,1) forwards;position:relative}
@keyframes wm{to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}

/* mobile nav */
.mnav{display:none}
@media (max-width:1180px){
  .hero{grid-template-columns:1fr;padding:40px}
  .phones{min-height:440px}
  .feats{grid-template-columns:repeat(2,1fr)}
  .reels{grid-template-columns:auto 60px;}
  .reels .rpanel{display:none}
  .reels .spacer{display:none}
  .cp,.calls,.lp{grid-template-columns:1fr}
  .sticky{position:static}
  .flow{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  :root{--side:0px}
  .side{display:none}
  .top{padding:10px 16px;gap:8px}
  .top .mbrand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:-.8px}
  .top .mbrand svg{width:22px}
  .ca{height:36px;padding:0 4px 0 10px;font-size:12px;flex:1}
  .ca .lbl{display:none}
  .ca button span:not(.ic){display:none}
  .ca button{width:30px;padding:0;justify-content:center}
  .xbtn,.wallet{height:36px}
  .xbtn{width:36px}
  .wallet span.full,.wallet .mono{display:none}
  .wallet{width:36px;padding:0}
  .ca{flex:1 1 auto}
  .drop{flex-wrap:wrap}
  .drop>.btn{display:none}
  .view{padding:18px 16px 110px}
  .hero{padding:28px 20px;border-radius:22px;min-height:0}
  .hero h1{font-size:46px;letter-spacing:-2.4px}
  .hero p{font-size:16px}
  .phones{min-height:380px;margin:0 -10px}
  .phone{width:180px;height:330px;border-radius:28px}
  .phone .scr{border-radius:21px}
  .phone.p1{left:-2%}.phone.p2{left:calc(50% - 90px)}.phone.p3{left:auto;right:-2%}
  .float-chip{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:16px}
  .stat b{font-size:21px}
  .feats{grid-template-columns:1fr}
  .h1{font-size:34px}
  .search{max-width:none;margin-left:0}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .coin .cover{height:170px;padding:11px}
  .coin .cap{font-size:19px}
  .coin .body{padding:11px}
  .meta{grid-template-columns:1fr}
  .meta div:nth-child(n+2){display:none}
  .av{width:34px;height:34px}
  .reels{grid-template-columns:1fr;min-height:0}
  .reels .rnav{display:none}
  .ractions{flex-direction:row;justify-content:center;align-self:center;padding:0}
  .reel{height:auto;width:calc(100vw - 32px);max-width:420px}
  .reels>div:nth-child(2){flex-direction:column;align-items:center!important}
  .reel .rc h2{font-size:36px}
  .steps{grid-template-columns:1fr 1fr}
  .steps div:nth-child(2){border-right:0}
  .steps div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .fsec{padding:20px}
  .fsec>p{margin-left:0}
  .fgrid,.arch{grid-template-columns:1fr}
  .cp-head{flex-direction:column;align-items:flex-start;padding:20px}
  .posts{padding:0 16px 16px;gap:6px}
  .tabs{padding:0 16px 14px}
  .docs{grid-template-columns:1fr}
  .toc{display:none}
  .dsec{padding:22px 20px}
  .flow{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr 1fr}
  .foot>div:first-child{grid-column:1/-1}
  .chat{height:calc(100vh - 250px)}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
  .mnav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--tx3);padding:4px 8px}
  .mnav a svg{width:22px;height:22px}
  .mnav a.on{color:var(--tx)}
  .mnav a.plus .pi{width:42px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#000}
  .mnav a.plus .pi svg{width:20px;height:20px}
}

/* generated avatar (no upload) */
function genAvatar(name, vibe){
  const c=document.createElement('canvas'); c.width=c.height=320; const x=c.getContext('2d');
  const p=PALETTES[vibe]||PALETTES.Bullish; const g=x.createLinearGradient(0,0,320,320);
  g.addColorStop(0,p[2]); g.addColorStop(.6,p[1]); g.addColorStop(1,p[0]); x.fillStyle=g; x.fillRect(0,0,320,320);
  x.fillStyle='rgba(0,0,0,.85)'; x.font='900 170px Inter, sans-serif'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText((name||'?').trim().charAt(0).toUpperCase()||'?',160,172);
  return c.toDataURL('image/webp',.9);
}
function resizeImage(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) return rej('Use PNG, JPG, WEBP or GIF');
    if(file.size>5*1024*1024) return rej('Max 5 MB');
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(im.width,im.height); const c=document.createElement('canvas'); c.width=c.height=320; const x=c.getContext('2d'); x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,320,320); res(c.toDataURL('image/webp',.86)); }; im.onerror=()=>rej('Could not read this image'); im.src=fr.result; };
    fr.onerror=()=>rej('Could not read this file'); fr.readAsDataURL(file);
  });
}

/* posts generator */
function makePost(coin, n, ts){
  const seed=hash(coin.id+':'+n);
  const voice=coin.voice||'Wholesome';
  const pool=[...(LINES[voice]||LINES.Wholesome), ...(ARCH_LINES[coin.arch]||[])];
  let txt=pick(pool, seed);
  if(n===0) txt = voice==='Loud' ? `HI, I'M ${coin.name.toUpperCase()}. ${('$'+coin.ticker)} STARTS NOW.` : `hi, i'm ${coin.name.toLowerCase()}. ${'$'+coin.ticker} starts now.`;
  txt=txt.replace(/\{T\}/g,'$'+coin.ticker).replace(/\{C\}/g, coin.catch||('$'+coin.ticker+' forever')).replace(/\{N\}/g, n+1);
  const vibe=(coin.vibes&&coin.vibes[seed%coin.vibes.length])||'Bullish';
  return {id:coin.id+'_'+n, coin:coin.id, n, text:txt, vibe, ts:ts||coin.created+n*60000};
}
function postBg(p){ const c=PALETTES[p.vibe]||PALETTES.Bullish; return `background:linear-gradient(160deg,${c[1]} 0%,${c[0]} 70%,#000 130%);color:#fff`; }
function postHTML(p, coin, cls=''){
  return `<div class="post ${cls}" style="${postBg(p)}" data-reel="${esc(p.id)}"><div class="ph"><img src="${esc(coin.img)}" alt="">${esc(coin.handle||coin.name.toLowerCase())}</div><div class="pt">${esc(p.text)}</div><span class="ptk">$${esc(coin.ticker)}</span></div>`;
}

const Store = {
  api:false, coins:[], calls:[], ca:'',
  async init(){
    if(location.protocol.startsWith('http')){
      try{ const r=await fetch('/api/stats',{cache:'no-store'}); if(r.ok && (r.headers.get('content-type')||'').includes('json')) this.api=true; }catch(e){}
    }
    await this.refresh();
  },
  async refresh(){
    if(this.api){
      try{
        const [c,m,ca]=await Promise.all([fetch('/api/coins').then(r=>r.json()),fetch('/api/calls').then(r=>r.json()),fetch('/api/ca').then(r=>r.json())]);
        this.coins=c.coins||[]; this.calls=m.calls||[]; this.ca=ca.ca||CONFIG.OFFICIAL_CA;
      }catch(e){}
    } else {
      this.coins=LS.get('coins',[]); this.calls=LS.get('calls',[]); this.ca=CONFIG.OFFICIAL_CA;
    }
    this.coins.sort((a,b)=>b.created-a.created);
  },
  async launch(coin){
    if(this.api){
      const r=await fetch('/api/launch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(coin)});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||'Launch failed, try again');
      await this.refresh(); return j.coin||coin;
    }
    const last=LS.get('lastLaunch',0); if(Date.now()-last<60000) throw new Error('One launch per minute. Try again in '+Math.ceil((60000-(Date.now()-last))/1000)+'s');
    const all=LS.get('coins',[]); all.unshift(coin); LS.set('coins',all); LS.set('lastLaunch',Date.now());
    await this.refresh(); return coin;
  },
  async addPost(coinId, wallet, sig){
    if(this.api){
      const r=await fetch('/api/feed',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({coin:coinId,wallet,sig})});
      const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'Could not post'); await this.refresh(); return;
    }
    const all=LS.get('coins',[]); const c=all.find(x=>x.id===coinId); if(!c) return;
    c.pt=[...(c.pt||[]),Date.now()].slice(-60); LS.set('coins',all); await this.refresh();
  },
  async call(msg){
    if(this.api){
      const r=await fetch('/api/calls',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(msg)});
      const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'Could not send'); await this.refresh(); return;
    }
    const last=LS.get('lastCall',0); if(Date.now()-last<8000) throw new Error('Slow down a little');
    const all=LS.get('calls',[]); all.push(msg); LS.set('calls',all.slice(-300)); LS.set('lastCall',Date.now()); await this.refresh();
  },
  coin(id){ return this.coins.find(c=>c.id===id); },
  posts(coin){ const out=[]; const now=Date.now(); for(let i=0;i<4;i++) out.push(makePost(coin,i, Math.min(now, coin.created + i*90000))); (coin.pt||[]).forEach((ts,j)=>out.push(makePost(coin,4+j,ts))); return out.sort((a,b)=>b.ts-a.ts); },
  allPosts(){ return this.coins.flatMap(c=>this.posts(c).map(p=>({p,c}))).sort((a,b)=>b.p.ts-a.p.ts); }
};

const Wallet = {

  async connect(){
    if(!window.ethereum){ openModal(`<div class="bigav" style="background:none;display:grid;place-items:center">${LOGO(90)}</div><h2>Connect a wallet</h2><p>SYNTH runs on ${CONFIG.CHAIN}. Open this page in an EVM wallet (MetaMask, Rabby, Coinbase Wallet…) or install the extension, then connect again.</p><div class="acts"><button class="btn btn-sec" onclick="closeModal()">Got it</button></div>`); return ''; }
    try{ const a=await window.ethereum.request({method:'eth_requestAccounts'}); this.addr=(a&&a[0]||'').toLowerCase(); LS.set('wallet',this.addr); renderChrome(); toast('Wallet connected'); route(); return this.addr; }
    catch(e){ toast('Connection cancelled',1); return ''; }
  },
  disconnect(){ this.addr=''; LS.set('wallet',''); renderChrome(); route(); toast('Disconnected'); },

  }
};

function vLaunch(show){
  const e={};
  const name=clean(F.name), t=clean(F.ticker), h=clean(F.handle);
  if(!F.img) e.img='Add a character image (or we generate one from the name).';
  if(name.length<2) e.name='Name needs at least 2 characters.';
  if(!/^[A-Z0-9]{2,10}$/.test(t)) e.ticker='2–10 letters or digits.';
  else if(Store.coins.some(c=>c.ticker===t)) e.ticker='This ticker is already taken here.';
  if(!/^[a-z0-9._]{2,24}$/.test(h)) e.handle='2–24 lowercase letters, digits, . or _';
  else if(Store.coins.some(c=>c.handle===h)) e.handle='This handle is taken.';
  const urlOk=u=>!u||/^https:\/\/[^\s<>"']+$/.test(u);
  if(!urlOk(F.links.x)||!urlOk(F.links.tg)||!urlOk(F.links.web)) e.links='Links must start with https://';
  else if(F.links.x&&!/^https:\/\/(x|twitter)\.com\//.test(F.links.x)) e.links='X link must be an x.com link.';
  else if(F.links.tg&&!/^https:\/\/t\.me\//.test(F.links.tg)) e.links='Telegram link must be a t.me link.';
  if(show){ ['img','name','ticker','handle','links'].forEach(k=>{ const el=$('#e_'+k); if(el) el.textContent=e[k]||''; }); }
  return e;
}

function bindCalls(){
  const box=$('#msgs'); box.scrollTop=box.scrollHeight;
  const send=async()=>{
    if(!Wallet.addr) return Wallet.connect();
    const t=clean($('#callText').value); const coin=$('#callCoin').value;
    if(!t) return toast('Write something first',1);
    if(/(https?:\/\/|www\.|\.(com|io|xyz|fun|net|org|app)\b|t\.me|0x[a-fA-F0-9]{20,}|[1-9A-HJ-NP-Za-km-z]{32,44})/i.test(t)) return toast('No links or contract addresses in Calls',1);
    try{ await Store.call({id:uid(),wallet:Wallet.addr,text:t.slice(0,280),coin,ts:Date.now()}); route(); }catch(e){ toast(e.message,1); }
  };
  $('#callSend').onclick=send; $('#callText').onkeydown=e=>{ if(e.key==='Enter') send(); };
}

/* ============ ROUTER ============ */
async function route(){
  const raw=curPath(); const [path,anchor]=raw.split('#'); const parts=path.split('/'); const k=parts[0]||'';
  clearInterval(REEL.timer);
  renderChrome();
  const v=$('#view');
  if(k===''){ v.innerHTML=pageExplore(); bindExplore(); }
  else if(k==='coin'){ v.innerHTML=pageCoin(parts[1]); bindCoin(parts[1]); }
  else if(k==='reels'){ v.innerHTML=pageReels(parts[1]); bindReels(); }
  else if(k==='launch'){ v.innerHTML=pageLaunch(); bindLaunch(); }
  else if(k==='calls'){ v.innerHTML=pageCalls(); bindCalls(); }
  else if(k==='me'){ v.innerHTML=pageMe(); bindCards(); }
  else if(k==='docs'){ v.innerHTML=pageDocs(); }
  else if(k==='about'){ v.innerHTML=pageAbout(); }
  else { CUR='#/'; return route(); }
  document.title = ({'':'SYNTH · coins with a face',reels:'Reels · SYNTH',launch:'Launch · SYNTH',calls:'Calls · SYNTH',me:'My synths · SYNTH',docs:'How it works · SYNTH',about:'About · SYNTH',coin:'Synth · SYNTH'})[k]||'SYNTH';
  if(anchor){ setTimeout(()=>{ const el=document.getElementById(anchor); if(el) el.scrollIntoView({behavior:'smooth'}); },30); }
  else if(!route._keep) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{ if(location.hash!==CUR){ CUR=location.hash||'#/'; route(); } });
window.addEventListener('popstate',()=>{ CUR=location.hash||'#/'; route(); });
document.addEventListener('click',e=>{
  const ext=e.target.closest('a[target="_blank"]'); if(ext){ return; }
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  e.preventDefault();
  const h=a.getAttribute('href'); if(h==='#') return;
  if(!h.startsWith('#/')){ const el=document.getElementById(h.slice(1)); if(el) el.scrollIntoView({behavior:'smooth'}); return; }
  go(h);
});

/* ============ BACKGROUND ============ */
(function(){
  const c=$('#bg'), x=c.getContext('2d'); let W,H,pts=[]; const dpr=Math.min(2,devicePixelRatio||1);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rs(){ W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0); pts=Array.from({length:Math.round(W*H/26000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,v:Math.random()*.25+.05,a:Math.random()*.5+.1})); }
  rs(); addEventListener('resize',rs);
  let t=0;
  function draw(){ t+=.004; x.clearRect(0,0,W,H);
    const gx=W*(.65+.15*Math.sin(t)), gy=H*(.25+.1*Math.cos(t*1.3)); const g=x.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*.6); g.addColorStop(0,'rgba(61,255,122,0.055)'); g.addColorStop(1,'rgba(61,255,122,0)'); x.fillStyle=g; x.fillRect(0,0,W,H);
    for(const p of pts){ p.y-=p.v; if(p.y<-5){p.y=H+5;p.x=Math.random()*W;} x.fillStyle=`rgba(61,255,122,${p.a*.5})`; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); }
    if(!reduce) requestAnimationFrame(draw);
  }
  draw();
})();


/* ============ INTRO ============ */
(function(){
  const el=document.getElementById('intro'); if(!el) return;
  let seen=false; try{ seen=sessionStorage.getItem('synth_intro')==='1'; sessionStorage.setItem('synth_intro','1'); }catch(e){}
  if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches){ el.remove(); return; }
  let done=false; const end=()=>{ if(done) return; done=true; el.classList.add('out'); setTimeout(()=>el.remove(),650); };
  el.addEventListener('click',end); setTimeout(end,1900);
})();

/* ============ BOOT ============ */
(async()=>{
  renderChrome();
  $('#view').innerHTML='<div style="padding:80px;text-align:center">'+LOGO(60)+'</div>';
  await Store.init();
  route();
  if(Store.api) setInterval(async()=>{ const k=(curPath().split('/')[0])||''; if(['','calls'].includes(k) && !document.activeElement.matches('input,textarea,select')){ const before=JSON.stringify([Store.coins.length,Store.calls.length]); await Store.refresh(); if(JSON.stringify([Store.coins.length,Store.calls.length])!==before){ route._keep=1; const y=scrollY; await route(); scrollTo(0,y); route._keep=0; } } },15000);
})();
